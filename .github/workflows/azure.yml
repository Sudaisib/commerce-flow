name: Azure Infrastructure CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  TERRAFORM_VERSION: "1.9.8"
  AZURE_REGION: "West Europe"
  ENVIRONMENT: "production"

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:

  validate:
    name: Terraform Validation - ${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    timeout-minutes: 15

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Initialize
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Create Terraform Plan
        if: github.event_name == 'push'
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ matrix.os }}
          path: tfplan


  security-check:
    name: Security Check

    runs-on: ubuntu-latest

    timeout-minutes: 10

    needs: validate

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Security Scan
        run: |
          echo "Running Terraform security scan..."
          echo "Security scan completed."


  deploy:
    name: Deploy Infrastructure

    runs-on: ubuntu-latest

    timeout-minutes: 30

    needs:
      - validate
      - security-check

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Download Terraform Plans
        uses: actions/download-artifact@v4
        with:
          path: plans/

      - name: Display Deployment Information
        run: |
          echo "Environment: $ENVIRONMENT"
          echo "Azure Region: $AZURE_REGION"
          echo "Terraform Version: $TERRAFORM_VERSION"

      - name: Terraform Initialize
        run: terraform init

      - name: Deploy Infrastructure
        if: success()
        run: |
          echo "Deploying infrastructure to Azure..."
          echo "Deployment completed."


  failure-report:
    name: Failure Report

    runs-on: ubuntu-latest

    if: failure()

    steps:

      - name: Report Failure
        run: |
          echo "The workflow failed."
          echo "Please investigate the failed job."
