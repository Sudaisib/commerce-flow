name: Python CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# ========================================
# WORKFLOW VARIABLES
# ========================================

env:
  PYTHON_VERSION: "3.12"
  APPLICATION_NAME: "my-python-app"
  BUILD_FOLDER: "build"
  ENVIRONMENT: "production"


# ========================================
# CONCURRENCY
# ========================================

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true


jobs:

  # ========================================
  # JOB 1: BUILD
  # ========================================

  build:

    name: Build Python Application

    runs-on: ubuntu-latest

    env:
      BUILD_MESSAGE: "Building Python application"

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}


      - name: Display Variables
        run: |
          echo "Application: $APPLICATION_NAME"
          echo "Python Version: $PYTHON_VERSION"
          echo "Environment: $ENVIRONMENT"
          echo "Build Folder: $BUILD_FOLDER"
          echo "$BUILD_MESSAGE"


      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Create Build Directory
        run: mkdir -p $BUILD_FOLDER


      - name: Build Application
        run: |
          cp -r *.py $BUILD_FOLDER/
          echo "Python application build completed."


      - name: Check Build Files
        run: ls -la $BUILD_FOLDER


      - name: Upload Python Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-build
          path: ${{ env.BUILD_FOLDER }}


  # ========================================
  # JOB 2: TEST
  # ========================================

  test:

    name: Test Python Application

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}


      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Download Python Artifact
        uses: actions/download-artifact@v4
        with:
          name: python-build
          path: ${{ env.BUILD_FOLDER }}


      - name: Check Artifact
        run: ls -la $BUILD_FOLDER


      - name: Run Tests
        run: pytest


  # ========================================
  # JOB 3: DEPLOY
  # ========================================

  deploy:

    name: Deploy Python Application

    runs-on: ubuntu-latest

    needs: test

    env:
      DEPLOY_MESSAGE: "Deploying Python application"

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Download Python Artifact
        uses: actions/download-artifact@v4
        with:
          name: python-build
          path: ${{ env.BUILD_FOLDER }}


      - name: Check Deployment Files
        run: ls -la $BUILD_FOLDER


      - name: Deploy Application
        run: |
          echo "$DEPLOY_MESSAGE"
          echo "Application: $APPLICATION_NAME"
          echo "Environment: $ENVIRONMENT"
          echo "Python Version: $PYTHON_VERSION"
          echo "Deployment completed successfully!"

